version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install -r requirements.txt -r requirements-dev.txt
  build:
    commands:
      - echo "Corriendo pruebas"
      - python -m pytest -v

artifacts:
  files:
    - app/**/*
    - requirements.txt
    - Procfile
